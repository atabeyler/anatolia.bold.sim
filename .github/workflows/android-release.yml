name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-android:
    name: Publish Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # x.y.z -> x*10000 + y*100 + z, e.g. 2.3.46 -> 20346. Must strictly
          # increase release over release for Android's package manager to
          # accept a sideloaded APK as an upgrade rather than a conflict.
          code=$(node -e "const [x,y,z]=require('./package.json').version.split('.').map(Number); console.log(x*10000+y*100+z)")
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build sim-server for arm64-v8a
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # cargo-ndk 4.x's own -p is a plain passthrough to cargo's -p
          # (package selector) -- its platform-API-level flag is the
          # long-form --platform only, no short alias, specifically to avoid
          # this exact collision.
          cargo ndk -t arm64-v8a --platform 24 build --release --package sim-server
          mkdir -p ../client/android/app/src/main/jniLibs/arm64-v8a
          # Android only ever extracts jniLibs/*.so with execute permission
          # at install time -- this plain binary just needs that extension to
          # ride along, it is not really a shared object. See
          # LocalServerPlugin.java for the subprocess side of this.
          cp target/aarch64-linux-android/release/sim-server \
            ../client/android/app/src/main/jniLibs/arm64-v8a/libsimserver.so

      - name: wasm-bindgen-cli önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: wasm-bindgen-cli-0.2.126-${{ runner.os }}

      # client/src/wasmLocal/worker.ts statically imports this generated
      # package (see .gitignore's own comment on that path) -- the client
      # build below fails outright without it, same as any other platform's
      # client bundle. Native Local mode (LocalServerPlugin.java) is
      # untouched by this; it's an unrelated, purely additive browser-only
      # feature that happens to ship inside the same client bundle.
      # `npm run build:wasm` installs and uses its own pinned nightly
      # toolchain for this step specifically (wasm-bindgen-rayon's real
      # multi-threaded build needs `-Z build-std` -- see rust/sim-wasm's own
      # Cargo.toml/rust-toolchain.toml), independent of the stable 1.96.0
      # toolchain set up above for the Android/native builds.
      - name: sim-wasm paketini derle
        run: npm run build:wasm

      - name: Build client
        working-directory: client
        run: |
          npm ci --include=dev
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode signing keystore
        working-directory: client/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build signed release APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          # Every ${{ secrets.* }} value below is quoted, not just the ones with
          # spaces -- a secret pasted with a trailing/embedded newline (an easy
          # mistake via a browser's manual copy-paste) otherwise splits this
          # backslash-continued command in two: bash treats the *unquoted*
          # substitution's embedded newline as ending the physical line early,
          # silently dropping every flag after it and running the leftover
          # text as its own (failing) command.
          ./gradlew assembleRelease \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.version }}" \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Remove decoded keystore
        if: always()
        working-directory: client/android
        run: rm -f app/release.keystore

      - name: Rename APK
        run: |
          mkdir -p dist-android
          cp client/android/app/build/outputs/apk/release/app-release.apk \
            dist-android/anatolia-sim-${{ steps.version.outputs.version }}.apk

      - name: Create release tag
        run: |
          # Desktop Release and Android Release both trigger on the same
          # push and each try to create this same version tag -- whichever
          # job's push wins is fine, the other's "reference already exists"
          # rejection isn't a real failure, just proof someone else already
          # did the job. Only a genuine inability to create *or* observe the
          # tag afterward should fail the step.
          tag="v${{ steps.version.outputs.version }}"
          git fetch --tags
          if ! git rev-parse --verify --quiet "$tag" >/dev/null; then
            git tag "$tag"
            if ! git push origin "$tag"; then
              git fetch --tags
              git rev-parse --verify --quiet "$tag" >/dev/null
            fi
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Anatolia Sim v${{ steps.version.outputs.version }}
          files: |
            dist-android/*.apk
