name: Desktop Release

on:
  push:
    branches:
      - main
    # Mirrors render.yaml's own buildFilter.ignoredPaths reasoning -- none
    # of these paths are ever read by this workflow's own build (npm run
    # build's build:wasm + client + cargo build -p sim-server, then cargo
    # tauri build in desktop/src-tauri), so a push touching only these
    # doesn't need the full ~11-minute Windows build. Deliberately doesn't
    # include desktop/** (this workflow's own source) or this workflow file
    # itself.
    paths-ignore:
      - '**.md'
      - 'client/android/**'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/test.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  publish-windows:
    name: Publish Windows Desktop
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize Tauri signing secrets
        shell: pwsh
        run: |
          # A manually-pasted secret (browser copy-paste) can pick up a
          # trailing or embedded newline the real key value never has --
          # minisign then rejects the whole key outright ("Invalid symbol
          # 10" is literally the newline character's ASCII code). Strip
          # every \r/\n before these ever reach `cargo tauri build`, rather
          # than relying on the secret having been pasted perfectly.
          $key = ("${{ secrets.TAURI_PRIVATE_KEY }}" -replace "`r", "" -replace "`n", "").Trim()
          $pw = ("${{ secrets.TAURI_KEY_PASSWORD }}" -replace "`r", "" -replace "`n", "").Trim()
          "TAURI_PRIVATE_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_KEY_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # actions/checkout resets every file's mtime to checkout time, even
      # for byte-identical content -- Cargo's own fingerprint check is
      # partially mtime-based, so a fresh checkout can look "newer" than a
      # perfectly-restored target/ cache and trigger an unnecessary
      # recompile of unchanged crates (confirmed: sim-core/sim-server
      # recompiling from scratch, ~3 minutes, despite Swatinem/rust-cache's
      # own restore reporting a full match with no source changes since the
      # cache was saved). This restores each tracked file's mtime to its
      # last commit's timestamp -- always older than whenever a prior run's
      # cargo build actually produced the cached artifacts -- so that check
      # comes out correctly negative. Best-effort: any failure here just
      # forgoes the speedup, never breaks the build (see the script's own
      # top-level try/catch).
      - name: Restore file mtimes from git history
        run: node scripts/restore-git-mtimes.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/sim-wasm
            desktop/src-tauri

      # build:wasm (npm run build's first step) installs its own pinned
      # nightly toolchain + rust-src + wasm32-unknown-unknown target via
      # rustup every single run (see scripts/build-wasm.mjs) -- unlike the
      # stable toolchain above (set up once by dtolnay/rust-toolchain, which
      # GitHub's runner image already ships pre-cached), this nightly one is
      # downloaded from scratch on every job. Caching ~/.rustup lets rustup
      # skip that download whenever the pinned nightly hasn't changed since
      # the last run. Keyed on build-wasm.mjs's own hash (that's where
      # NIGHTLY is defined) rather than a fixed string, so bumping the
      # pinned version automatically busts this cache instead of silently
      # restoring a stale toolchain forever (actions/cache never overwrites
      # an existing key).
      - name: Cache rustup nightly toolchain (sim-wasm)
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-sim-wasm-nightly-${{ hashFiles('scripts/build-wasm.mjs') }}

      - name: Cache Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-tauri-cli-v1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Root build
        run: npm run build

      - name: Build Tauri bundle
        working-directory: desktop/src-tauri
        run: cargo tauri build

      - name: Create release tag
        shell: pwsh
        run: |
          # Desktop Release and Android Release both trigger on the same
          # push and each try to create this same version tag -- whichever
          # job's push wins is fine, the other's "reference already exists"
          # rejection isn't a real failure, just proof someone else already
          # did the job. Only a genuine inability to create *or* observe the
          # tag afterward should fail the step.
          $tag = "v${{ steps.version.outputs.version }}"
          git fetch --tags
          git rev-parse --verify --quiet $tag | Out-Null
          if ($LASTEXITCODE -ne 0) {
            git tag $tag
            git push origin $tag
            if ($LASTEXITCODE -ne 0) {
              git fetch --tags
              git rev-parse --verify --quiet $tag | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to create or observe tag $tag"
              }
            }
          }

      - name: Generate updater manifest
        shell: pwsh
        run: |
          # The chooser page's checkUpdate() reads this file from the "latest"
          # release. cargo tauri build only writes the .nsis.zip + .sig
          # artifacts -- nothing before this ever assembled them into the
          # latest.json the Tauri updater plugin actually fetches, so
          # checkUpdate() always 404'd, was swallowed by its catch block, and
          # the app silently never offered an update.
          $version = "${{ steps.version.outputs.version }}"
          $zip = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.nsis.zip" | Select-Object -First 1
          if (-not $zip) { throw "No .nsis.zip artifact found - updater target may not have run" }
          $signature = (Get-Content -Path "$($zip.FullName).sig" -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version   = "v$version"
            notes     = "Anatolia Sim v$version"
            pub_date  = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://github.com/atabeyler/anatolia.bold.sim/releases/download/v$version/$($zip.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath "latest.json" -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Anatolia Sim v${{ steps.version.outputs.version }}
          files: |
            desktop/src-tauri/target/release/bundle/**/*
            latest.json
