[package]
name = "sim-wasm"
version = "0.1.0"
edition = "2021"

# Deliberately its own standalone crate, not a member of rust/'s native
# workspace (sim-core, sim-server) -- different target (wasm32), different
# profile needs (opt-level="s" + lto for a small bundle size, vs the native
# workspace's own opt-level=2 tuned for Render's build-time budget), and a
# separate Cargo.lock so a mobile release never gets dragged along by
# native-side dependency bumps or vice versa. Being physically nested under
# rust/ would otherwise make Cargo assume it belongs to that workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core = { path = "../sim-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

# wasm32-only: gives sim-core's existing rayon par_iter calls a real Web
# Worker-backed thread pool instead of running single-threaded inside the one
# worker that hosts this wasm module -- see lib.rs's init_thread_pool
# re-export and worker.ts's own call to it. Requires building with nightly +
# `-Z build-std` (see rust/sim-wasm/.cargo/config.toml and rust-toolchain.toml)
# since it needs std itself rebuilt with the `atomics`/`bulk-memory` target
# features; there is no stable-Rust path to this yet. Scoped to wasm32 only
# so native `cargo test` (see lib.rs's own doc comment on why tests run
# natively) never has to build it at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = "1.3"

[profile.release]
opt-level = "s"
lto = true

# wasm-pack's final packaging step normally runs binaryen's wasm-opt for extra
# size shrinkage, downloading a prebuilt binary on first use. Not needed for
# correctness -- disabled so builds don't depend on that download succeeding.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
