# fly.toml app configuration file generated for anatolia-bold-sim on 2026-07-31T09:39:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "anatolia-bold-sim"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3002"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  checks = [{ grace_period = '10s', interval = '15s', method = 'GET', path = '/api/health', timeout = '5s' }]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[[vm]]
  size = 'performance-cpu-8x'
  memory = '16gb'
  cpu_kind = 'performance'
  cpus = 8
  memory_mb = 16384
  processes = ['app']
