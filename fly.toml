# Fly.io app config for sim-server (see Dockerfile). App name matches the
# actual deployed app confirmed via the Fly.io dashboard/Launch UI (see
# AGENTS.md's production URL, https://anatolia-bold-sim.fly.dev).
#
# primary_region: the app's Postgres database is hosted in Oregon, US West
# (confirmed via the DB provider's own dashboard) -- "sjc" (San Jose,
# California) is the closest region this app's Fly.io plan actually offers
# (Seattle/"sea" is not in this account's region list), cutting DB
# round-trip latency from a transatlantic ~9000km (Amsterdam <-> Oregon) hop
# down to a same-coast one. This alone only steers where *new* machines get
# created; an already-running machine in "ams" must still be relocated by
# hand (see AGENTS.md's Tick pacing section for why that round-trip latency
# matters here).
app = "anatolia-bold-sim"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3002"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# Scaled up via the Fly dashboard (Scale Plan Configuration) to
# performance-8x / 16GB -- dedicated (not shared) vCPUs, since
# sim-core's per-tick compute (rayon-parallelized across the population)
# and the tick loop's spawn_blocking usage both benefit from real CPU
# throughput, not just avoiding DB latency (see the primary_region comment
# above for that half of the fix). "performance-cpu-8x" (an extra "-cpu"
# that snuck in during an earlier fly.toml cleanup) is not a real Fly.io
# machine size -- `flyctl` rejects it outright ("invalid machine size"),
# which silently failed every release built from that config while the
# app kept serving whatever machine was already running beforehand.
[[vm]]
  size = "performance-8x"
  memory = "16gb"
