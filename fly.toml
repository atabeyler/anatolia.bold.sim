# fly.toml app configuration file generated for anatolia-bold-sim on 2026-07-30T19:25:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'anatolia-bold-sim'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3002'

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
