# Fly.io app config for sim-server (see Dockerfile). App name here is a
# placeholder -- `flyctl launch`/the dashboard will ask you to confirm or
# change it (must be globally unique across all Fly.io apps).
app = "anatolia-sim"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3002"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
