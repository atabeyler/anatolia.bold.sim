# Fly.io app config for sim-server (see Dockerfile). App name matches the
# actual deployed app confirmed via the Fly.io dashboard/Launch UI (see
# AGENTS.md's production URL, https://anatolia-bold-sim.fly.dev).
#
# primary_region: the app's Postgres database is hosted in Oregon, US West
# (confirmed via the DB provider's own dashboard) -- "sjc" (San Jose,
# California) is the closest region this app's Fly.io plan actually offers
# (Seattle/"sea" is not in this account's region list), cutting DB
# round-trip latency from a transatlantic ~9000km (Amsterdam <-> Oregon) hop
# down to a same-coast one. This alone only steers where *new* machines get
# created; an already-running machine in "ams" must still be relocated by
# hand (see AGENTS.md's Tick pacing section for why that round-trip latency
# matters here).
app = "anatolia-bold-sim"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3002"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# Scaled down via the Fly dashboard (Scale Plan Configuration) to
# shared-cpu-1x / 256mb. Fly's own "flyio-scale-from-ui" auto-sync bot
# committed this change as a *second*, additional [[vm]] block on top of the
# previous performance-8x/16gb one instead of replacing it -- two [[vm]]
# blocks both implicitly targeting the "app" process is an invalid/ambiguous
# config, the same class of problem as the earlier "performance-cpu-8x is not
# a real machine size" incident above this same file's history: `flyctl`
# either rejects it or silently keeps serving whatever machine was already
# running. Collapsed back down to the single block that actually matches the
# dashboard's current setting.
#
# Note: this is a real capability drop from the previous dedicated-vCPU
# performance-8x machine -- sim-core's per-tick compute (rayon-parallelized
# across the population) and the tick loop's spawn_blocking usage now run on
# a single shared vCPU instead of 8 dedicated ones. Revisit this sizing if
# tick throughput/latency regresses under real population load.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
